<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#45539d">
    <meta name="description" content="날짜를 선택하고 나만의 일정을 기록하는 캘린더">
    <title>캘린더</title>
    <link rel="icon" href="data:,">
    <link rel="preload" href="./assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="CalendarApp" aria-label="캘린더와 날짜별 일정">
      <h1 class="CalendarApp__ScreenReaderOnly">캘린더</h1>

      <section class="Calendar" aria-labelledby="calendar-month">
        <header class="Calendar__Header">
          <h2 class="Calendar__Month" id="calendar-month" lang="en"></h2>
          <div class="Calendar__Navigation" aria-label="월 이동">
            <button class="Calendar__NavButton" type="button" data-direction="-1" aria-label="이전 달">
              <img class="Calendar__NavIcon" src="./assets/chevron.svg" alt="" width="14" height="14">
              <img class="Calendar__NavIcon Calendar__NavIcon--Disabled" src="./assets/chevron-disabled.svg" alt="" width="14" height="14">
            </button>
            <button class="Calendar__NavButton" type="button" data-direction="1" aria-label="다음 달">
              <img class="Calendar__NavIcon Calendar__NavIcon--Next" src="./assets/chevron.svg" alt="" width="14" height="14">
              <img class="Calendar__NavIcon Calendar__NavIcon--Next Calendar__NavIcon--Disabled" src="./assets/chevron-disabled.svg" alt="" width="14" height="14">
            </button>
          </div>
        </header>

        <div class="Calendar__Weekdays" aria-hidden="true" lang="en">
          <span class="Calendar__Weekday">Mo</span>
          <span class="Calendar__Weekday">Tu</span>
          <span class="Calendar__Weekday">We</span>
          <span class="Calendar__Weekday">Th</span>
          <span class="Calendar__Weekday">Fr</span>
          <span class="Calendar__Weekday">Sa</span>
          <span class="Calendar__Weekday">Su</span>
        </div>
        <div class="Calendar__Dates" id="calendar-dates" role="group" aria-labelledby="calendar-month"></div>
      </section>

      <p class="CalendarApp__StorageError" id="storage-error" role="alert" hidden></p>

      <section class="Schedule" id="schedule" aria-labelledby="schedule-date" hidden>
        <h2 class="Schedule__Date" id="schedule-date"></h2>
        <form class="Schedule__Form" id="schedule-form" novalidate>
          <label class="Schedule__Label" for="schedule-title">일정 제목</label>
          <div class="Schedule__InputRow">
            <input class="Schedule__Input" id="schedule-title" name="title" type="text" placeholder="어떤 일정을 기록할까요?" autocomplete="off" aria-describedby="schedule-error">
            <button class="Schedule__AddButton" type="submit">추가</button>
          </div>
          <p class="Schedule__Error" id="schedule-error" role="alert" hidden></p>
        </form>
        <ul class="Schedule__List" id="schedule-list" aria-label="선택한 날짜의 일정"></ul>
        <p class="Schedule__Empty" id="schedule-empty">등록된 일정이 없습니다</p>
      </section>

      <p class="CalendarApp__ScreenReaderOnly" id="app-status" role="status" aria-live="polite" aria-atomic="true"></p>
      <noscript><p class="CalendarApp__StorageError">캘린더를 사용하려면 JavaScript를 활성화해 주세요.</p></noscript>
    </main>
  </body>
</html>
